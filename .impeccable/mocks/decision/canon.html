<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Vereins-App</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#F9FAFB;color:#111827;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid #E5E7EB;padding:14px 16px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:50%;background:#E5E7EB}
header h1{font-size:17px;font-weight:700}
main{flex:1;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.t{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:14px}
.t.w{grid-column:span 2}
.t h2{font-size:12px;font-weight:600;color:#6B7280;text-transform:uppercase;letter-spacing:.04em}
.t .v{font-size:22px;font-weight:700;margin-top:6px}
.t .s{font-size:13px;color:#6B7280;margin-top:2px}
.btn{margin-top:12px;background:#2563EB;color:#fff;border-radius:8px;padding:10px;text-align:center;font-weight:600;font-size:14px}
nav{background:#fff;border-top:1px solid #E5E7EB;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px 22px}
nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#6B7280}
nav i{width:22px;height:22px;border-radius:6px;background:#E5E7EB}
nav a.on{color:#2563EB} nav a.on i{background:#2563EB}
</style></head><body>
<header><div class="logo"></div><h1>Die Bahnbrecher</h1></header>
<main>
  <div class="t w"><h2>Nächster Termin</h2><div class="v">Fr, 13.11.2026</div><div class="s">Gaststätte Schwenken (Beispiel)</div><div class="btn">Alle Termine</div></div>
  <div class="t"><h2>Gossenjunge</h2><div class="v">Christopher, Nico</div><div class="s">je 11</div></div>
  <div class="t"><h2>Kegelkönig</h2><div class="v">Hendrik</div><div class="s">4 Siege</div></div>
  <div class="t"><h2>Spieltage</h2><div class="v">3</div><div class="s">in 2026</div></div>
  <div class="t"><h2>Mitglieder</h2><div class="v">8</div><div class="s">aktiv</div></div>
</main>
<nav><a class="on"><i></i>Start</a><a><i></i>Termine</a><a><i></i>Spieltage</a><a><i></i>Statistik</a><a><i></i>Mehr</a></nav>
</body></html>
